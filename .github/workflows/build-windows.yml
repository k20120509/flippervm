name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag, e.g. v0.3.0'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

concurrency:
  group: release-assets-${{ github.ref_name }}
  cancel-in-progress: false

env:
  PYVER: '3.11'

jobs:
  build-exe:
    name: Build single-file FlipperVM.exe
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean flippervm.spec

      - name: Verify artifact
        shell: pwsh
        run: |
          $exe = Get-Item "dist\FlipperVM.exe" -ErrorAction Stop
          if ($exe.Length -lt 20MB) { throw "FlipperVM.exe too small ($($exe.Length) bytes)" }
          Write-Host "OK: FlipperVM.exe $([math]::Round($exe.Length/1MB,1))MB"

      - name: Upload exe to Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ github.event.inputs.version }}'
          } else {
            '${{ github.ref_name }}'
          }
          Write-Host "Uploading FlipperVM.exe to tag=$tag"
          if (-not (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null)) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title "FlipperVM $tag" --notes "CI" --latest
          }
          gh release delete-asset $tag FlipperVM.exe --repo $env:GITHUB_REPOSITORY --yes 2>$null
          gh release upload $tag "dist\FlipperVM.exe" --repo $env:GITHUB_REPOSITORY --clobber

  build-portable:
    name: Build portable zip (embeddable python)
    needs: [build-exe]
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Download embeddable Python
        shell: pwsh
        run: |
          $url = 'https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip'
          $ProgressPreference = 'SilentlyContinue'
          $retries = 5
          for ($i = 1; $i -le $retries; $i++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile python-embed.zip -UseBasicParsing
              break
            } catch {
              Write-Host "retry $i / $retries"
              Start-Sleep -Seconds ($i * 5)
            }
          }
          if (-not (Test-Path python-embed.zip)) { throw 'embeddable download failed' }

      - name: Assemble portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'out-p\FlipperVM'
          New-Item -ItemType Directory -Force -Path "$root\python", "$root\python\Lib\site-packages", "$root\app" | Out-Null
          Expand-Archive -Path python-embed.zip -DestinationPath "$root\python" -Force
          python -m pip install --upgrade --target "$root\python\Lib\site-packages" PySide6 unicorn
          Get-ChildItem "$root\python\Lib\site-packages" -Recurse -Directory -Filter __pycache__ |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

          Copy-Item main.py -Destination "$root\app\"
          Copy-Item flipper_vm -Recurse -Destination "$root\app\"
          Copy-Item README.md, requirements.txt -Destination "$root\app\"

          # ---------- 写文件工具函数 ----------
          function Write-Text($path, [string[]]$lines, $enc = 'ASCII') {
            [System.IO.File]::WriteAllLines($path, $lines, [System.Text.Encoding]::$enc)
          }

          # Launcher bat (with console)
          $bat1 = @(
            'echo off',
            'setlocal',
            'cd /d "%~dp0"',
            'if not exist "app\main.py" ( echo [ERROR] app\main.py not found & pause & exit /b 1 )',
            'if exist "python\python.exe" ( "%~dp0python\python.exe" "%~dp0app\main.py" %* ) else ( echo [ERROR] python\python.exe not found & pause & exit /b 1 )',
            'endlocal'
          )
          Write-Text "$root\FlipperVM.bat" $bat1

          # Launcher bat (no console)
          $bat2 = @(
            'echo off',
            'setlocal',
            'cd /d "%~dp0"',
            'start "" /B "%~dp0python\pythonw.exe" "%~dp0app\main.py" %*',
            'endlocal'
          )
          Write-Text "$root\FlipperVM_无控制台.bat" $bat2

          # Embeddable python .pth (site-packages + app on sys.path)
          $pth = @(
            'python311.zip',
            '.',
            'Lib\site-packages',
            '..\app',
            'import site'
          )
          Write-Text "$root\python\python311._pth" $pth

          $appver = python -c "from flipper_vm._version import __version__; print(__version__)"
          # README_FIRST (UTF8)
          $readme = @(
            '========================================================',
            "  FlipperVM Portable Edition (Windows x64)  v$appver",
            '========================================================',
            '',
            'Unzip this folder, then double-click either:',
            '   .\FlipperVM.bat            (with console log)',
            '   .\FlipperVM_无控制台.bat   (GUI only)',
            '',
            'No Python / VC++ / any install needed - fully portable.',
            '',
            'Full manual: app\README.md or https://github.com/k20120509/flippervm',
            '========================================================'
          )
          Write-Text "$root\README_FIRST.txt" $readme UTF8

          $zip = "FlipperVM-v$appver-portable-win64.zip"
          if (Test-Path $zip) { Remove-Item -Force $zip }
          Compress-Archive -Path $root -DestinationPath $zip -CompressionLevel Optimal
          $fi = Get-Item $zip
          Write-Host "OK: $zip  $([math]::Round($fi.Length/1MB,1))MB"
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload portable zip to Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ github.event.inputs.version }}'
          } else {
            '${{ github.ref_name }}'
          }
          Write-Host "Uploading $env:ZIP_NAME to tag=$tag"
          if (-not (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null)) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title "FlipperVM $tag" --notes "CI" --latest
          }
          gh release delete-asset $tag $env:ZIP_NAME --repo $env:GITHUB_REPOSITORY --yes 2>$null
          gh release upload $tag $env:ZIP_NAME --repo $env:GITHUB_REPOSITORY --clobber
